version: 2

updates:
  # Action pins rot silently: a major-version tag keeps moving until the
  # runner drops the Node version it targets, and then every workflow
  # breaks at once. Weekly PRs make that a review, not an outage.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all routine action bumps rather than four.
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
