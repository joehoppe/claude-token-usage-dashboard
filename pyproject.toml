[project]
name = "claude-usage"
version = "0.1.0"
description = "Usage Dashboard for Claude: desktop and CLI views of Claude Code subscription quota"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["wxPython"]

[project.scripts]
claude-usage = "claude_usage.ui.cli.main:main"
claude-usage-app = "claude_usage.ui.app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["claude_usage*"]

[tool.setuptools.package-data]
"claude_usage.ui.app" = ["assets/*.png"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
